name: Deploy Readme

on:
  workflow_run:
    workflows: ["Deploy"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      GQL_API_GITHUB_TOKEN: ${{ secrets.GQL_API_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out llm-wiki
        uses: actions/checkout@v4
        with:
          repository: teimurjan/llm-wiki
          ssh-key: ${{ secrets.LLM_WIKI_DEPLOY_KEY }}
          path: .llm-wiki

      # Keep the wiki outside the repo, as it is locally, so the Next build never traces it.
      - name: Move llm-wiki beside the repo
        run: |
          mv .llm-wiki "$RUNNER_TEMP/llm-wiki"
          echo "LLM_WIKI_DIR=$RUNNER_TEMP/llm-wiki" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn

      - name: Generate readme
        run: yarn workspace @teimurjan/profile-readme generate-readme
  
      - name: Clone teimurjan repo
        run: |
          git clone https://x-access-token:${{ secrets.TEIMURJAN_REPO_TOKEN }}@github.com/teimurjan/teimurjan.git

      - name: Copy readme to teimurjan
        run: |
          cp workspaces/profile-readme/README.md teimurjan/README.md

      - name: Commit and push changes to teimurjan
        working-directory: teimurjan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README.md content from teimurjan.github.io" || echo "No changes to commit"
          git push origin HEAD:main
