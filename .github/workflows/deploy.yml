name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'workspaces/**'
  workflow_dispatch:
  repository_dispatch:
    types: [wiki-updated]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      GQL_API_GITHUB_TOKEN: ${{ secrets.GQL_API_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out llm-wiki
        uses: actions/checkout@v4
        with:
          repository: teimurjan/llm-wiki
          ssh-key: ${{ secrets.LLM_WIKI_DEPLOY_KEY }}
          path: .llm-wiki

      # Keep the wiki outside the repo, as it is locally, so the Next build never traces it.
      - name: Move llm-wiki beside the repo
        run: |
          mv .llm-wiki "$RUNNER_TEMP/llm-wiki"
          echo "LLM_WIKI_DIR=$RUNNER_TEMP/llm-wiki" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: 'yarn'

      - name: Install xvfb (Virtual Display) # puppeteer needs that
        run: sudo apt-get install -y xvfb

      - name: Install dependencies
        run: yarn
      
      - name: Install playwright
        run: yarn workspace @teimurjan/website playwright install

      - name: Generate opengraph
        run: yarn workspace @teimurjan/website generate-opengraph:ci

      - name: Generate resume
        run: yarn workspace @teimurjan/website generate-resume

      - name: Build
        run: yarn workspace @teimurjan/website build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./workspaces/website/out
